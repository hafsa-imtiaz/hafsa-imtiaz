      <animateTransform attributeName="transform" type="rotate"    values="0 610 0;-360 610 0" dur="7.1s" begin="-6.2s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="760">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="6.6s" begin="-2.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 760 0;360 760 0"  dur="6.6s" begin="-2.1s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="860">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="7.8s" begin="-4.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 860 0;-360 860 0" dur="7.8s" begin="-4.4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="130">
