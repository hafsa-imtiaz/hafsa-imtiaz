      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="7.2s" begin="-4.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 60 0;360 60 0"    dur="7.2s" begin="-4.9s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="220">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="6.7s" begin="-0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 220 0;-360 220 0" dur="6.7s" begin="-0.3s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="370">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="7.6s" begin="-3.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 370 0;360 370 0"  dur="7.6s" begin="-3.2s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="520">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="7.1s" begin="-6.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 520 0;-360 520 0" dur="7.1s" begin="-6.5s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="670">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="6.9s" begin="-1.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 670 0;360 670 0"  dur="6.9s" begin="-1.7s" repeatCount="indefinite" additive="sum"/>
