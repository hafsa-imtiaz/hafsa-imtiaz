<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1c1228" stop-opacity="1"/>
      <stop offset="32%"  stop-color="#3b2352" stop-opacity="1"/>
      <stop offset="56%"  stop-color="#7c5c82" stop-opacity="0.55"/>
      <stop offset="76%"  stop-color="#c49ad8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <g id="f">
      <rect x="-3" y="-9" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="-9" y="-3" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="3"  y="-3" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="-3" y="3"  width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="-3" y="-3" width="6" height="6" shape-rendering="crispEdges" opacity="0.85"/>
    </g>
  </defs>

  <rect width="900" height="250" fill="url(#bg)"/>

  <!-- Name -->
  <text x="450" y="100"
        text-anchor="middle"
        font-family="Georgia,serif"
        font-size="46"
        font-weight="bold"
        fill="#ffffff"
        opacity="0.97">Hafsa Imtiaz</text>

  <!-- Rotating phrases -->
  <text x="450" y="143"
        text-anchor="middle"
        font-family="Georgia,serif"
        font-size="17"
        fill="#f5d576"
        letter-spacing="1">
    Building Multi-Agent LLM Systems
    <animate attributeName="opacity" values="1;1;0;0"         keyTimes="0;0.278;0.333;1"               dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="143"
        text-anchor="middle"
        font-family="Georgia,serif"
        font-size="17"
        fill="#f5d576"
        letter-spacing="1"
        opacity="0">
    Turning Ideas into Intelligent Systems
    <animate attributeName="opacity" values="0;0;1;1;0;0"     keyTimes="0;0.333;0.389;0.611;0.667;1"   dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="143"
        text-anchor="middle"
        font-family="Georgia,serif"
        font-size="17"
        fill="#f5d576"
        letter-spacing="1"
        opacity="0">
    Probably Debugging an Agent Right Now
    <animate attributeName="opacity" values="0;0;1;1;0"       keyTimes="0;0.667;0.722;0.944;1"         dur="9s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="172"
        text-anchor="middle"
        font-family="Georgia,serif"
        font-size="13"
        fill="#d3a6f0"
        opacity="0.75"
        letter-spacing="0.5">LangGraph  ·  RAG  ·  Fine-tuning  ·  Computer Science</text>

  <!-- Flowers fall within the 250 px hero -->
  <g fill="#f7a8cf" opacity="0.82">
    <use href="#f" x="40">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="7.0s" begin="-1.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 40 0;360 40 0"    dur="7.0s" begin="-1.4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="180">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="7.6s" begin="-5.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 180 0;-360 180 0" dur="7.6s" begin="-5.3s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="320">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="6.8s" begin="-3.0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 320 0;360 320 0"  dur="6.8s" begin="-3.0s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="470">
