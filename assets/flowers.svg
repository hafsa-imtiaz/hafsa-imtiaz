      <animateTransform attributeName="transform" type="rotate"    values="0 400 0;360 400 0"  dur="7.5s" begin="-5.8s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="550">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,265" dur="7.0s" begin="-2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 550 0;-360 550 0" dur="7.0s" begin="-2.6s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="700">
