<svg width="900" height="70" viewBox="0 0 900 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="pxflower">
      <rect x="-3" y="-9" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="-9" y="-3" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="3" y="-3" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="-3" y="3" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="-3" y="-3" width="6" height="6" shape-rendering="crispEdges" opacity="0.85"/>
    </g>
  </defs>
  <g fill="#f7a8cf">
    <use href="#pxflower" x="60" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,85" dur="4.4s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 60 0;360 60 0" dur="4.4s" begin="0s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#pxflower" x="300" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-35;0,85" dur="5.1s" begin="1.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 300 0;-360 300 0" dur="5.1s" begin="1.1s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#pxflower" x="620" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-25;0,85" dur="4.7s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 620 0;360 620 0" dur="4.7s" begin="2s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g fill="#d3a6f0">
    <use href="#pxflower" x="180" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-45;0,85" dur="5s" begin="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 180 0;360 180 0" dur="5s" begin="0.6s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#pxflower" x="470" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-20;0,85" dur="4.6s" begin="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 470 0;-360 470 0" dur="4.6s" begin="1.8s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#pxflower" x="800" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,85" dur="5.3s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 800 0;360 800 0" dur="5.3s" begin="0.3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
  <g fill="#f5d576">
    <use href="#pxflower" x="410" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-55;0,85" dur="4.9s" begin="1.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 410 0;360 410 0" dur="4.9s" begin="1.4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#pxflower" x="730" y="0">
      <animateTransform attributeName="transform" type="translate" values="0,-10;0,85" dur="4.3s" begin="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 730 0;-360 730 0" dur="4.3s" begin="2.4s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
</svg>
