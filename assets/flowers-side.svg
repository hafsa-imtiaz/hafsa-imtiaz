<svg width="70" height="720" viewBox="0 0 70 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      Gradient mirrors the hero's fade but scaled to this taller strip.
      The hero is 250px tall; this strip is 720px.
      We want the background to be fully gone by ~250px (H35% of 720).
    -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1c1228" stop-opacity="1"/>
      <stop offset="11%"  stop-color="#3b2352" stop-opacity="1"/>
      <stop offset="19%"  stop-color="#7c5c82" stop-opacity="0.55"/>
      <stop offset="27%"  stop-color="#c49ad8" stop-opacity="0.12"/>
      <stop offset="35%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <g id="f">
      <rect x="-3" y="-9" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="-9" y="-3" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="3"  y="-3" width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="-3" y="3"  width="6" height="6" shape-rendering="crispEdges"/>
      <rect x="-3" y="-3" width="6" height="6" shape-rendering="crispEdges" opacity="0.85"/>
    </g>
  </defs>

  <rect width="70" height="720" fill="url(#bg)"/>

  <!-- Pink  4 flowers across the 70px strip -->
  <g fill="#f7a8cf" opacity="0.82">
    <use href="#f" x="12">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="7.0s" begin="-1.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 12 0;360 12 0"   dur="7.0s" begin="-1.4s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="58">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="7.6s" begin="-5.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 58 0;-360 58 0"  dur="7.6s" begin="-5.3s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="35">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="6.8s" begin="-2.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 35 0;360 35 0"   dur="6.8s" begin="-2.8s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="20">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="7.3s" begin="-6.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 20 0;-360 20 0"  dur="7.3s" begin="-6.5s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- Lavender  4 flowers -->
  <g fill="#d3a6f0" opacity="0.82">
    <use href="#f" x="35">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="7.4s" begin="-3.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 35 0;360 35 0"   dur="7.4s" begin="-3.7s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="58">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="6.9s" begin="-0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 58 0;-360 58 0"  dur="6.9s" begin="-0.9s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="12">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="7.5s" begin="-4.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 12 0;360 12 0"   dur="7.5s" begin="-4.9s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="48">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="7.1s" begin="-7.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 48 0;-360 48 0"  dur="7.1s" begin="-7.2s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- Yellow  4 flowers -->
  <g fill="#f5d576" opacity="0.82">
    <use href="#f" x="58">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="7.2s" begin="-0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 58 0;360 58 0"   dur="7.2s" begin="-0.3s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="12">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="6.7s" begin="-6.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 12 0;-360 12 0"  dur="6.7s" begin="-6.2s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="35">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="7.6s" begin="-1.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 35 0;360 35 0"   dur="7.6s" begin="-1.7s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#f" x="25">
      <animateTransform attributeName="transform" type="translate" values="0,-15;0,735" dur="7.0s" begin="-4.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"    values="0 25 0;-360 25 0"  dur="7.0s" begin="-4.3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>
</svg>
